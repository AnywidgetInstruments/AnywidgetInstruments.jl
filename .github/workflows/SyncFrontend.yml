name: Sync front end

# Refresh the vendored front end of anywidget-instruments-industrial (JL-GEN-007): download
# the wheel, run scripts/sync-assets.sh, copy the parity cases, and open a pull
# request when something changed. The wheel comes from the documentation site
# until anywidget-instruments-industrial publishes releases.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      wheel:
        description: "Wheel URL of anywidget-instruments-industrial (default: the one served by its documentation site)"
        required: false
      core_wheel:
        description: "Wheel URL of the anywidget-instruments core (default: the one served next to it)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the parity cases come from the repository of anywidget-instruments-industrial
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: AnywidgetInstruments/anywidget-instruments-industrial
          path: .upstream
      - name: Vendor the wheel
        run: scripts/sync-assets.sh "${{ inputs.wheel }}" "${{ inputs.core_wheel }}"
      - name: Copy the parity cases
        if: hashFiles('.upstream/tests/parity/*.json') != ''
        run: |
          for f in test/parity/*.json; do
            cp ".upstream/tests/parity/$(basename "$f")" "$f"
          done
      - name: Remove the upstream checkout
        run: rm -rf .upstream
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-frontend-auto
          commit-message: |
            chore: sync the front end of anywidget-instruments-industrial

            Assisted-by: AI
          title: "chore: sync the front end of anywidget-instruments-industrial"
          body: |
            Automated refresh of `assets/` (see `assets/SOURCE.toml`) and `test/parity/`.
            Review the diff of `assets/contract.json`: a changed trait or message may need
            changes to the Julia API. Close and reopen the pull request to run the checks.
          delete-branch: true
