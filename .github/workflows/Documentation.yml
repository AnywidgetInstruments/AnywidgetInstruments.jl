name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: read
  statuses: write

env:
  JULIA_PKG_USE_CLI_GIT: "true"

jobs:
  docs:
    name: Build and deploy the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Access Anywidget.jl (unregistered; private until published)
        shell: bash
        env:
          TOKEN: ${{ secrets.ANYWIDGET_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/s-celles/Anywidget.jl".insteadOf "https://github.com/s-celles/Anywidget.jl"
          fi
      - name: Instantiate
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --color=yes --project=docs docs/make.jl
